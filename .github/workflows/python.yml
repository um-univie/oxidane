name: Test the Python bindings

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "1"
      RAYON_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the local bindings and test dependencies
        run: uv sync --locked --project bindings/python --extra notebook
      - name: Test the API and notebook display
        run: uv run --no-sync --project bindings/python pytest bindings/python/tests
