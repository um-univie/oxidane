name: Test the Python bindings

# Linux only by default; macOS and Windows too when run by hand, on a tag, or
# on a pull request labelled full-ci. scripts/ci-local.sh runs the same tests.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**.md', 'docs/**', 'assets/**', 'LICENSE']
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'assets/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.pull_request.labels.*.name, 'full-ci'))
          && '[{"os":"ubuntu-latest","python":"3.9"},{"os":"ubuntu-latest","python":"3.14"},{"os":"macos-latest","python":"3.12"},{"os":"windows-latest","python":"3.12"}]'
          || '[{"os":"ubuntu-latest","python":"3.9"},{"os":"ubuntu-latest","python":"3.14"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "1"
      RAYON_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the local bindings and test dependencies
        run: uv sync --locked --project bindings/python --extra notebook
      - name: Test the API and notebook display
        run: uv run --no-sync --project bindings/python pytest bindings/python/tests
