name: Test and package the library

# Linux only on pull requests; macOS and Windows too when run by hand, on a
# tag, or on a pull request labelled full-ci. scripts/ci-local.sh runs the same
# checks.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**.md', 'docs/**', 'assets/**', 'LICENSE']
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test on ${{ matrix.os }}
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.pull_request.labels.*.name, 'full-ci'))
          && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    env:
      # Debug info in every example and test binary fills the Linux runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Check every target
        run: cargo +stable check --locked --all-features --all-targets
      - name: Run library, regression and documentation tests
        run: cargo +stable test --locked --all-features

  release:
    name: Draft a source release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Archive the tagged library and verify its contents
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version=$(cargo +stable metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "oxidane") | .version')
          test "$RELEASE_TAG" = "v$package_version"
          release_name="oxidane-$package_version"
          archive_path="$RUNNER_TEMP/$release_name.tar.gz"
          git archive --format=tar --prefix="$release_name/" HEAD | gzip -n > "$archive_path"
          tar -xzf "$archive_path" -C "$RUNNER_TEMP"
          cargo +stable check --locked --all-features --all-targets --manifest-path "$RUNNER_TEMP/$release_name/Cargo.toml"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$release_name.tar.gz" > "$release_name.tar.gz.sha256"
          )
          echo "RELEASE_ARCHIVE=$archive_path" >> "$GITHUB_ENV"
      - name: Create a draft with the source and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" \
            --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
