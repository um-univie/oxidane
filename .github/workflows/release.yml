name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
          - os: darwin
            arch: amd64
            target: x86_64-apple-darwin
          - os: darwin
            arch: arm64
            target: aarch64-apple-darwin
          - os: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            ext: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp target/${{ matrix.target }}/release/molecules.exe release/molecules_${{ matrix.os }}_${{ matrix.arch }}.exe
          else
            cp target/${{ matrix.target }}/release/molecules release/molecules_${{ matrix.os }}_${{ matrix.arch }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: molecules_${{ matrix.os }}_${{ matrix.arch }}
          path: release/molecules_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.ext || '' }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: release

      - name: Flatten release directory
        run: |
          mkdir -p flat
          find release -type f -exec cp {} flat/ \;
          ls -la flat/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: flat/*
          draft: false
          prerelease: false
          generate_release_notes: true 