name: Build the Python wheels

# Only when run by hand (Actions tab, "Run workflow"), on a tag, or on a pull
# request labelled full-ci; scripts/ci-local.sh builds the same wheels locally.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  wheel:
    name: Wheel for ${{ matrix.name }}
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'full-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86-64, runner: ubuntu-latest, target: x86_64, manylinux: '2014', image: 'python:3.12-slim', platform: linux/amd64 }
          - { name: Linux ARM64, runner: ubuntu-latest, target: aarch64, manylinux: '2014', image: 'python:3.12-slim', platform: linux/arm64 }
          - { name: Linux x86-64 musl, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, image: 'python:3.12-alpine', platform: linux/amd64 }
          - { name: Linux ARM64 musl, runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2, image: 'python:3.12-alpine', platform: linux/arm64 }
          - { name: macOS Intel, runner: macos-15-intel, target: x86_64, native: true }
          - { name: macOS Apple silicon, runner: macos-latest, target: aarch64, native: true }
          - { name: Windows x64, runner: windows-latest, target: x64, native: true }
          - { name: Windows ARM64, runner: windows-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build an abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
      - name: Set up emulation for the Linux test container
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
      - name: Install the wheel and normalize a file (Linux container)
        if: matrix.image
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD/bindings/python:/io" -w /tmp ${{ matrix.image }} sh -euc '
            pip install --quiet /io/dist/*.whl
            printf "id,smiles\n1,Oc1ccccn1\n" > in.csv
            oxidane-normalize in.csv out.csv -s smiles
            grep -q "O=c1\[nH\]cccc1" out.csv
            python -c "import oxidane as ox; assert ox.canonical_tautomer(\"Oc1ccccn1\") == \"O=c1[nH]cccc1\""'
      - name: Install the wheel and normalize a file
        if: matrix.native
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then bin="$RUNNER_TEMP/venv/Scripts"; else bin="$RUNNER_TEMP/venv/bin"; fi
          "$bin/python" -m pip install --quiet bindings/python/dist/*.whl
          cd "$RUNNER_TEMP"
          printf 'id,smiles\n1,Oc1ccccn1\n' > in.csv
          "$bin/oxidane-normalize" in.csv out.csv -s smiles
          grep -q 'O=c1\[nH\]cccc1' out.csv
          "$bin/python" -c 'import oxidane as ox; assert ox.canonical_tautomer("Oc1ccccn1") == "O=c1[nH]cccc1"'
      - uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: bindings/python/dist/*.whl

  sdist:
    name: Source distribution
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  wheels:
    name: All wheels in one download
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: oxidane-python-wheels
          path: dist/*
