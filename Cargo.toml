[package]
name = "oxidane"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Cheminformatics in pure Rust: SMILES, SMARTS, SDF, stereochemistry, canonical SMILES and tautomer keys, substructure and maximum common subgraph search, reactions, fingerprints, descriptors, 3D embedding and the MMFF94 and UFF force fields"
documentation = "https://docs.rs/oxidane"
repository = "https://github.com/um-univie/oxidane"
readme = "README.md"
keywords = ["chemistry", "cheminformatics", "smiles", "molecule", "smarts"]
categories = ["science", "parser-implementations", "data-structures"]
# The permutation corpus is a benchmark input, not something a dependent needs
# to download. Everything else under tests/ is read by doctests and stays.
exclude = ["tests/smiles_tree_permutations.txt", "notes/", "prototype/", "*.svg"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# The neural-network half: tensors, autodiff and optimizers. Everything under
# `ml` that only shapes data -- batching, splitting, normalization -- is
# dependency-free and always compiled; this feature adds the parts that need a
# tensor library. candle's default feature set is pure Rust on the CPU, so
# enabling it pulls in no BLAS, CUDA or Metal unless the dependent asks.
ml = ["dep:candle-core", "dep:candle-nn"]

[dependencies]
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
chemistry_consts = "0.3.1"
itertools = "0.14.0"
kiddo = "5.3.3"
ndarray = "0.17.1"
faer = "0.24"
wide = "0.7"
pulp = "0.22"
nohash-hasher = "0.2.0"
petgraph = "0.8"
rand = "0.9.2"
rayon = "1.11.0"
tinyvec = "1.10.0"
bitvec = "1.0.1"
bit-set = "0.8.0"
rustc-hash = "2.1.1"
canonaut = "1.1.0"
rustfft = "6.4.1"

[dev-dependencies]
# pubchem_sweep maps the corpus rather than reading it.
memmap2 = "0.9"
memchr = "2"
# The local publication runner (examples/publication.rs) speaks JSON lines.
serde_json = "1"


[profile.release]
# faer's SIMD dispatch needs thin LTO; fat LTO discards dispatch symbols.
lto = "thin"
strip = true
codegen-units = 1

[[example]]
name = "train_mpnn"
required-features = ["ml"]

[[example]]
name = "autoencode_smiles"
required-features = ["ml"]

[[example]]
name = "dump_graphs"
required-features = ["ml"]

[[example]]
name = "encoder_reference"
required-features = ["ml"]

[[example]]
name = "pretrain_encoder"
required-features = ["ml"]

[[example]]
name = "pretrain_supervised"
required-features = ["ml"]
