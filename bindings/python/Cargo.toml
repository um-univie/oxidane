[package]
name = "oxidane-python"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "_oxidane"
crate-type = ["cdylib"]

[dependencies]
oxidane = { path = "../.." }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
rayon = "1.12"
